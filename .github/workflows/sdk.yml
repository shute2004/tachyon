name: sdk

on:
  workflow_call:

jobs:
  python-sdk:
    # Tachyon must be able to run required CI without OpenAI's private runner groups.
    # The Python SDK job already executes its actual test workload inside Docker,
    # so a standard GitHub-hosted Linux runner preserves the intended environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test Python SDK
        shell: bash
        run: |
          set -euo pipefail

          # Run inside a glibc Linux image so dependency resolution exercises
          # the pinned manylinux runtime wheel that users install.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}/sdk/python" \
            python:3.12-slim \
            sh -euxc '
              python -m venv /tmp/uv
              /tmp/uv/bin/python -m pip install uv==0.11.3
              /tmp/uv/bin/uv sync --group dev --frozen
              /tmp/uv/bin/uv run --frozen --no-sync ruff check --output-format=github .
              /tmp/uv/bin/uv run --frozen --no-sync ruff format --check .
              /tmp/uv/bin/uv run --frozen --no-sync pytest
            '

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  sdks:
    # Keep the Bazel/TypeScript SDK validation required, but run it on public
    # GitHub infrastructure. The Bazel wrapper already has an unauthenticated
    # fallback when the BuildBuddy secret is unavailable. A cold local Bazel
    # build on a cold standard hosted runner can exceed one hour, so leave enough
    # time for the full V8 build without reducing SDK test coverage.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: bazel
      deployment: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux bwrap build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Bazel CI
        id: setup_bazel
        uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu

      - name: Build codex with Bazel
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          codex_target="//codex-rs/cli:codex"
          code_mode_host_target="//codex-rs/code-mode-host:codex-code-mode-host"

          # Use the shared CI wrapper so fork PRs fall back cleanly when
          # BuildBuddy credentials are unavailable. This workflow needs the
          # built `codex` binary on disk afterwards, so ask the wrapper to
          # override CI's default remote_download_minimal behavior.
          ./.github/scripts/run-bazel-ci.sh \
            --remote-download-toplevel \
            -- \
            build \
            --build_metadata=COMMIT_SHA=${GITHUB_SHA} \
            --build_metadata=TAG_job=sdk \
            -- \
            "${codex_target}" \
            "${code_mode_host_target}"

          # Resolve each exact output using the same wrapper/config path as the
          # build instead of guessing which Bazel convenience symlink is
          # available on the runner.
          resolve_bazel_output_path() {
            local target="$1"
            local binary_name="$2"
            local cquery_output
            cquery_output="$(
              ./.github/scripts/run-bazel-ci.sh \
                -- \
                cquery \
                --output=files \
                -- \
                "${target}" \
                | grep -E '^(/|bazel-out/)' \
                | tail -n 1
            )"
            if [[ -z "${cquery_output}" ]]; then
              echo "Bazel did not report an output path for ${target}." >&2
              exit 1
            fi
            local output_path
            if [[ "${cquery_output}" = /* ]]; then
              output_path="${cquery_output}"
            else
              output_path="${GITHUB_WORKSPACE}/${cquery_output}"
            fi
            if [[ ! -e "${output_path}" ]]; then
              echo "Unable to locate the Bazel-built ${binary_name} binary at ${output_path}." >&2
              exit 1
            fi
            printf '%s\n' "${output_path}"
          }

          codex_bazel_output_path="$(resolve_bazel_output_path "${codex_target}" "codex")"
          code_mode_host_bazel_output_path="$(resolve_bazel_output_path "${code_mode_host_target}" "codex-code-mode-host")"

          # Stage the binary into the workspace and point the SDK tests at that
          # stable path. The tests spawn `codex` directly many times, so using a
          # normal executable path is more reliable than invoking Bazel for each
          # test process.
          install_dir="${GITHUB_WORKSPACE}/.tmp/sdk-ci"
          mkdir -p "${install_dir}"
          install -m 755 "${codex_bazel_output_path}" "${install_dir}/codex"
          install -m 755 "${code_mode_host_bazel_output_path}" "${install_dir}/codex-code-mode-host"
          echo "CODEX_EXEC_PATH=${install_dir}/codex" >> "$GITHUB_ENV"

      - name: Warm up Bazel-built codex
        shell: bash
        run: |
          set -euo pipefail
          "${CODEX_EXEC_PATH}" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages
        run: pnpm -r --filter ./sdk/typescript run build

      - name: Lint SDK packages
        run: pnpm -r --filter ./sdk/typescript run lint

      - name: Test SDK packages
        run: pnpm -r --filter ./sdk/typescript run test

      - name: Save bazel repository cache
        if: always() && !cancelled() && steps.setup_bazel.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.setup_bazel.outputs.repository-cache-path }}
          key: bazel-cache-x86_64-unknown-linux-gnu-${{ hashFiles('MODULE.bazel', 'codex-rs/Cargo.lock', 'codex-rs/Cargo.toml') }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
